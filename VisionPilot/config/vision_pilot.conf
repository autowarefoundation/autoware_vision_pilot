# VisionPilot configuration template
#   cp config/vision_pilot.conf.example config/vision_pilot.conf

# ─── Input source ────────────────────────────────────────────────────────────
source.mode             = video

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

# ─── ONNX models ───────────────────────────────────────────────────────────────
engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

# Model precision fp32 or int8 for quantized models lowercase
model.precision    = fp32

# ───────────────────────────────────────────────────────────────────────────────
speed_limit      = 33.3;   # m/s
L                = 2.860   # Front axle to CoG (m). Wheelbase L = Lf + Lr

# ─── GUI ───────────────────────────────────────────────────────────────────────
# Enable/Disable visualization
visualization_on = true

# Enable/Disable webrtc
webrtc_on = false
webrtc_port = 8080

# ─── Rerun logging ───────────────────────────────────────────────────────────
# Stream per-frame data directly to an .rrd recording (open with: rerun <file>).
rrd_on  = false
rrd_log = visionpilot.rrd

# ─── Front radar (1V1R) ──────────────────────────────────────────────────────
# When enabled, AutoSpeed range uses radar (FOV then lateral path) instead of H.
# calib_file: YAML with extrinsics + radar_extrinsics (T_sensor→ego), same as H.yaml.
# Empty = aligned front cam/radar. For ZOD, paste those two 4x4s from calibration.json.
# radar.enabled requires a ROS2 build. Own radar_ros2_interface on sensor_msgs/PointCloud2.
# Fields: x,y (range=hypot, az=atan2(y,x)) or range+azimuth; rate from range_rate|doppler|velocity.
# Frame: X forward, Y left. Main pairs camera stamp to closest scan within sync_slop_ms, else empty.
radar.enabled        = false
radar.hfov_deg       = 50
radar.calib_file     = radar_calib.yaml
radar.topic          = /radar/points
radar.sync_slop_ms   = 80
radar.lat_buffer_m   = 0.5
radar.path_buffer_m  = 1.0
radar.max_range_m    = 150
